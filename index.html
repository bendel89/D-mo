<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok oEmbed Ultimate Pro</title>
<style>
  :root {
    --primary: #fe2c55;
    --primary-glow: #fe2c5580;
    --secondary: #25f4ee;
    --bg: #0a0a0a;
    --card: #141414;
    --card-hover: #1a1a1a;
    --text: #ffffff;
    --muted: #888;
    --border: #2a2a2a;
    --success: #00e676;
    --danger: #ff1744;
    --warning: #ffab00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* Animated background */
  .bg-gradient {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, #fe2c5515 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #25f4ee10 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #7b2ff510 0%, transparent 70%);
    z-index: -1;
    pointer-events: none;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px 80px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 40px;
    position: relative;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    background: linear-gradient(135deg, #fe2c55, #25f4ee, #7b2ff5);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientMove 6s ease infinite;
    letter-spacing: -0.5px;
  }
  @keyframes gradientMove {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .subtitle {
    color: var(--muted);
    margin-top: 8px;
    font-size: 1rem;
  }
  .version {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 12px;
    background: #fe2c5520;
    color: var(--primary);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 24px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    opacity: 0.5;
  }
  .card:hover {
    border-color: #fe2c5540;
    box-shadow: 0 0 30px #fe2c5510;
  }

  /* Input */
  .input-wrapper {
    position: relative;
    margin-bottom: 16px;
  }
  .input-wrapper input, .input-wrapper textarea {
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #0f0f0f;
    color: var(--text);
    font-size: 15px;
    transition: all 0.25s;
  }
  .input-wrapper input:focus, .input-wrapper textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }
  textarea { min-height: 100px; resize: vertical; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-primary {
    background: linear-gradient(135deg, #fe2c55, #ff4d6d);
    color: white;
    box-shadow: 0 4px 15px #fe2c5540;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px #fe2c5560;
  }
  .btn-secondary {
    background: #222;
    color: white;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: #2a2a2a; border-color: #444; }
  .btn-success { background: var(--success); color: #000; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
  }
  .btn-ghost:hover { color: white; background: #222; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
  }

  /* History pills */
  .history {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .history-item {
    background: #1a1a1a;
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 12px;
    cursor: pointer;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.2s;
  }
  .history-item:hover {
    border-color: var(--primary);
    background: #fe2c5515;
  }

  /* Results */
  .result-card {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
  }
  @media (max-width: 700px) {
    .result-card { grid-template-columns: 1fr; }
  }

  .thumb-container {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #0a0a0a;
    aspect-ratio: 9/16;
    max-height: 480px;
    box-shadow: 0 10px 40px #00000060;
  }
  .thumb-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
  }
  .thumb-container:hover img { transform: scale(1.03); }
  
  .thumb-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, #000000dd 0%, transparent 50%);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px;
    gap: 8px;
  }
  .thumb-container:hover .thumb-overlay { opacity: 1; }

  .info-grid {
    display: grid;
    gap: 12px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid #222;
    font-size: 14px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--muted); }
  .info-value {
    text-align: right;
    max-width: 65%;
    word-break: break-all;
  }
  .copyable {
    color: var(--secondary);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .copyable:hover { opacity: 0.8; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .badge-primary { background: #fe2c5530; color: #fe2c55; }
  .badge-cyan { background: #25f4ee20; color: #25f4ee; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    overflow-x: auto;
  }
  .tab {
    padding: 8px 18px;
    border-radius: 10px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab:hover { color: white; background: #222; }
  .tab.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 12px #fe2c5540;
  }

  .json-box {
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    max-height: 320px;
    overflow: auto;
    font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1a1a1a;
    color: white;
    padding: 14px 28px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px #00000080;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* Loading spinner */
  .spinner {
    width: 18px;
    height: 18px;
    border: 2.5px solid #ffffff40;
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress bar for batch */
  .progress-bar {
    height: 4px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 16px;
    display: none;
  }
  .progress-bar.active { display: block; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    width: 0%;
    transition: width 0.3s;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Floating action */
  .fab {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fe2c55, #ff4d6d);
    color: white;
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 6px 25px #fe2c5560;
    z-index: 100;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fab:hover { transform: scale(1.1) rotate(90deg); }

  .hidden { display: none !important; }

  /* Color picker for theme */
  .theme-toggle {
    position: absolute;
    top: 0;
    right: 0;
  }

  /* Image zoom modal */
  .modal {
    position: fixed;
    inset: 0;
    background: #000000ee;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px #000;
  }
  .modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #222;
    border: none;
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="container">
    <header>
      <h1>TikTok oEmbed Ultimate Pro</h1>
      <p class="subtitle">Extracteur ultra-avancé • Miniatures • Métadonnées • Embed • Batch • Export</p>
      <span class="version">v3.0 • 100% Client-Side</span>
    </header>

    <!-- Main Input Card -->
    <div class="card">
      <div class="input-wrapper">
        <input type="text" id="tiktokUrl" 
               placeholder="Colle une ou plusieurs URLs TikTok ici..." 
               value="https://www.tiktok.com/@scout2015/video/6718335390845095173">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="fetchBtn" onclick="processUrls()">
          <span id="btnText">⚡ Analyser</span>
        </button>
        <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Coller</button>
        <button class="btn btn-secondary" onclick="clearAll()">🗑 Effacer</button>
        <button class="btn btn-secondary" onclick="toggleBatch()">📦 Batch</button>
        <button class="btn btn-secondary" onclick="exportJSON()">💾 JSON</button>
        <button class="btn btn-secondary" onclick="copyAllImages()">🖼 Images</button>
        <button class="btn btn-secondary" onclick="downloadAllImages()">⬇ Tout DL</button>
      </div>

      <div id="batchArea" class="hidden" style="margin-top:20px">
        <div class="input-wrapper">
          <textarea id="batchInput" placeholder="Colle plusieurs URLs (une par ligne)..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="processBatch()">Lancer le batch</button>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="history" id="history"></div>

      <div class="stats-bar" id="statsBar" style="display:none">
        <div class="stat-item">✅ <span id="statSuccess">0</span> succès</div>
        <div class="stat-item">❌ <span id="statError">0</span> erreurs</div>
        <div class="stat-item">🖼 <span id="statImages">0</span> images</div>
      </div>
    </div>

    <!-- Results -->
    <div id="results"></div>

    <!-- Detail Panel -->
    <div class="card hidden" id="rawCard">
      <div class="tabs">
        <button class="tab active" data-tab="info" onclick="showTab('info')">📋 Infos</button>
        <button class="tab" data-tab="json" onclick="showTab('json')">🧱 JSON</button>
        <button class="tab" data-tab="embed" onclick="showTab('embed')">💻 Embed</button>
        <button class="tab" data-tab="markdown" onclick="showTab('markdown')">📝 Markdown</button>
        <button class="tab" data-tab="html" onclick="showTab('html')">🖼 HTML Card</button>
      </div>

      <div id="tab-info"></div>
      <div id="tab-json" class="hidden">
        <div class="json-box" id="rawJson"></div>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="copyText(document.getElementById('rawJson').textContent)">Copier JSON</button>
        </div>
      </div>
      <div id="tab-embed" class="hidden">
        <div class="json-box" id="embedCode"></div>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="copyText(document.getElementById('embedCode').textContent)">Copier Embed</button>
        </div>
        <div id="embedPreview" style="margin-top:16px"></div>
      </div>
      <div id="tab-markdown" class="hidden">
        <div class="json-box" id="markdownCode"></div>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="copyText(document.getElementById('markdownCode').textContent)">Copier Markdown</button>
        </div>
      </div>
      <div id="tab-html" class="hidden">
        <div class="json-box" id="htmlCardCode"></div>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="copyText(document.getElementById('htmlCardCode').textContent)">Copier HTML</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Zoom Modal -->
  <div class="modal" id="zoomModal" onclick="closeZoom()">
    <button class="modal-close" onclick="closeZoom()">✕</button>
    <img id="zoomImg" src="" alt="Zoom">
  </div>

  <div class="toast" id="toast"></div>

  <button class="fab" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Haut de page">↑</button>

<script>
// ====================== STATE ======================
let history = JSON.parse(localStorage.getItem('tt_history_v3') || '[]');
let allResults = [];
let currentItem = null;

// ====================== INIT ======================
renderHistory();
document.getElementById('tiktokUrl').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) processUrls();
});

// ====================== CORE ======================
async function processUrls() {
  const input = document.getElementById('tiktokUrl').value.trim();
  if (!input) return toast('Colle au moins une URL TikTok');

  const urls = extractUrls(input);
  if (!urls.length) return toast('Aucune URL TikTok valide');

  setLoading(true);
  allResults = [];
  showProgress(true);

  for (let i = 0; i < urls.length; i++) {
    updateProgress((i / urls.length) * 100);
    try {
      const data = await fetchOembed(urls[i]);
      allResults.push({ url: urls[i], data, success: true });
      addToHistory(urls[i]);
    } catch (err) {
      allResults.push({ url: urls[i], error: err.message, success: false });
    }
  }

  updateProgress(100);
  setTimeout(() => showProgress(false), 600);
  setLoading(false);
  renderResults();
  updateStats();

  if (allResults.length === 1 && allResults[0].success) {
    showDetails(0);
  }
}

async function processBatch() {
  const text = document.getElementById('batchInput').value.trim();
  if (!text) return toast('Zone batch vide');
  document.getElementById('tiktokUrl').value = text;
  await processUrls();
}

function extractUrls(text) {
  const regex = /https?:\/\/(?:www\.|vm\.|vt\.|m\.)?tiktok\.com\/[^\s<>"']+/gi;
  const matches = text.match(regex) || [];
  return [...new Set(matches.map(u => u.replace(/[.,;!?)\]}>]+$/, '')))];
}

async function fetchOembed(url) {
  const endpoint = `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`;
  const res = await fetch(endpoint);
  if (!res.ok) throw new Error(`Erreur ${res.status}`);
  return res.json();
}

// ====================== RENDER ======================
function renderResults() {
  const container = document.getElementById('results');
  container.innerHTML = '';

  allResults.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';

    if (!item.success) {
      card.innerHTML = `
        <div style="color:var(--danger);font-weight:600;margin-bottom:8px">❌ Échec</div>
        <div style="word-break:break-all;font-size:13px;margin-bottom:8px">${item.url}</div>
        <div style="color:var(--muted);font-size:13px">${item.error}</div>`;
      container.appendChild(card);
      return;
    }

    const d = item.data;
    const thumb = d.thumbnail_url || '';
    const title = d.title || 'Sans titre';
    const author = d.author_name || 'Inconnu';

    card.innerHTML = `
      <div class="result-card">
        <div>
          <div class="thumb-container">
            ${thumb ? `<img src="${thumb}" alt="thumb" loading="lazy" onclick="openZoom('${thumb}')">` : 
              `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#555">Aucune image</div>`}
            <div class="thumb-overlay">
              <button class="btn btn-success" onclick="downloadImage('${thumb}','${sanitize(title)}')">⬇ Télécharger</button>
              <button class="btn btn-secondary" onclick="copyText('${thumb}')">📋 Copier URL</button>
              <button class="btn btn-secondary" onclick="openZoom('${thumb}')">🔍 Zoom</button>
            </div>
          </div>
          <div style="margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:12px">
            <span>📐 ${d.thumbnail_width||'?'}×${d.thumbnail_height||'?'}</span>
            <span>🎬 ${d.type||'video'}</span>
          </div>
        </div>

        <div>
          <h3 style="font-size:1.15rem;margin-bottom:14px;line-height:1.35">${escapeHtml(title)}</h3>
          
          <div class="info-grid">
            <div class="info-row">
              <span class="info-label">Auteur</span>
              <span class="info-value">
                <a href="${d.author_url||'#'}" target="_blank" style="color:var(--secondary)">${escapeHtml(author)}</a>
              </span>
            </div>
            <div class="info-row">
              <span class="info-label">ID Vidéo</span>
              <span class="info-value copyable" onclick="copyText('${extractId(item.url)}')">${extractId(item.url)||'—'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">URL</span>
              <span class="info-value copyable" onclick="copyText('${item.url}')" style="font-size:12px">${shorten(item.url,42)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Thumbnail</span>
              <span class="info-value copyable" onclick="copyText('${thumb}')" style="font-size:12px">${shorten(thumb,38)}</span>
            </div>
          </div>

          <div class="btn-group" style="margin-top:18px">
            <button class="btn btn-secondary" onclick="showDetails(${idx})">🔍 Détails</button>
            <button class="btn btn-secondary" onclick="copyMarkdown(${idx})">📝 MD</button>
            <button class="btn btn-secondary" onclick="copyEmbed(${idx})">💻 Embed</button>
            <button class="btn btn-secondary" onclick="copyHtmlCard(${idx})">🖼 Card</button>
          </div>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function showDetails(idx) {
  currentItem = allResults[idx];
  if (!currentItem?.success) return;

  const d = currentItem.data;
  const item = currentItem;

  document.getElementById('rawCard').classList.remove('hidden');

  // Info tab
  let infoHtml = '<div class="info-grid">';
  for (const [k, v] of Object.entries(d)) {
    if (typeof v === 'object') continue;
    infoHtml += `
      <div class="info-row">
        <span class="info-label">${k}</span>
        <span class="info-value copyable" onclick="copyText('${String(v).replace(/'/g,"\\'")}')">${escapeHtml(String(v).slice(0,140))}${String(v).length>140?'…':''}</span>
      </div>`;
  }
  infoHtml += '</div>';
  document.getElementById('tab-info').innerHTML = infoHtml;

  // JSON
  document.getElementById('rawJson').textContent = JSON.stringify(d, null, 2);

  // Embed
  const embed = d.html || generateEmbed(item.url, d);
  document.getElementById('embedCode').textContent = embed;
  document.getElementById('embedPreview').innerHTML = embed;

  // Markdown
  document.getElementById('markdownCode').textContent = 
`![${d.title||'TikTok'}](${d.thumbnail_url||''})

**${d.title||''}**

Par [${d.author_name||'Auteur'}](${d.author_url||'#'})

[Voir sur TikTok](${item.url})`;

  // HTML Card
  document.getElementById('htmlCardCode').textContent = generateHtmlCard(item);

  showTab('info');
  document.getElementById('rawCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function generateEmbed(url, data) {
  const id = extractId(url);
  return `<blockquote class="tiktok-embed" cite="${url}" data-video-id="${id}" style="max-width:605px;min-width:325px">
<section>
  <a target="_blank" href="${data.author_url||url}">@${data.author_name||'user'}</a>
  <p>${data.title||''}</p>
</section>
</blockquote>
<script async src="https://www.tiktok.com/embed.js"><\/script>`;
}

function generateHtmlCard(item) {
  const d = item.data;
  return `<!-- TikTok Card -->
<div style="max-width:320px;border-radius:16px;overflow:hidden;background:#111;border:1px solid #333;font-family:sans-serif">
  <a href="${item.url}" target="_blank">
    <img src="${d.thumbnail_url||''}" style="width:100%;display:block" alt="thumb">
  </a>
  <div style="padding:14px">
    <div style="font-weight:600;font-size:14px;margin-bottom:6px;color:#fff">${escapeHtml(d.title||'')}</div>
    <div style="font-size:12px;color:#aaa">@${escapeHtml(d.author_name||'')}</div>
  </div>
</div>`;
}

// ====================== TABS ======================
function showTab(name) {
  ['info','json','embed','markdown','html'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
    document.querySelector(`.tab[data-tab="${t}"]`)?.classList.toggle('active', t === name);
  });
}

// ====================== HISTORY ======================
function addToHistory(url) {
  history = history.filter(h => h !== url);
  history.unshift(url);
  if (history.length > 15) history.pop();
  localStorage.setItem('tt_history_v3', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  document.getElementById('history').innerHTML = history.map(url =>
    `<div class="history-item" onclick="loadHistory('${url.replace(/'/g,"\\'")}')" title="${url}">${shorten(url,32)}</div>`
  ).join('');
}

function loadHistory(url) {
  document.getElementById('tiktokUrl').value = url;
  processUrls();
}

// ====================== UTILS ======================
function setLoading(on) {
  document.getElementById('fetchBtn').disabled = on;
  document.getElementById('btnText').innerHTML = on ? '<span class="spinner"></span> Analyse...' : '⚡ Analyser';
}

function showProgress(show) {
  document.getElementById('progressBar').classList.toggle('active', show);
  if (!show) document.getElementById('progressFill').style.width = '0%';
}

function updateProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function updateStats() {
  const ok = allResults.filter(r => r.success).length;
  const err = allResults.length - ok;
  const imgs = allResults.filter(r => r.success && r.data.thumbnail_url).length;
  document.getElementById('statSuccess').textContent = ok;
  document.getElementById('statError').textContent = err;
  document.getElementById('statImages').textContent = imgs;
  document.getElementById('statsBar').style.display = allResults.length ? 'flex' : 'none';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('✅ Copié !')).catch(() => toast('Échec de la copie'));
}

function downloadImage(url, name) {
  if (!url) return toast('Pas d\'image');
  fetch(url).then(r => r.blob()).then(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (name || 'tiktok') + '.jpg';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Téléchargement lancé');
  }).catch(() => {
    window.open(url, '_blank');
    toast('Ouverture de l\'image');
  });
}

async function downloadAllImages() {
  const items = allResults.filter(r => r.success && r.data.thumbnail_url);
  if (!items.length) return toast('Aucune image');
  toast(`Téléchargement de ${items.length} image(s)...`);
  for (const item of items) {
    await downloadImage(item.data.thumbnail_url, sanitize(item.data.title));
    await new Promise(r => setTimeout(r, 400));
  }
}

function openZoom(url) {
  if (!url) return;
  document.getElementById('zoomImg').src = url;
  document.getElementById('zoomModal').classList.add('open');
}

function closeZoom() {
  document.getElementById('zoomModal').classList.remove('open');
}

function extractId(url) {
  const m = url.match(/video\/(\d+)/) || url.match(/\/v\/(\d+)/) || url.match(/(\d{15,})/);
  return m ? m[1] : null;
}

function sanitize(str) {
  return (str || 'tiktok').replace(/[^\w\s-]/g, '').trim().slice(0, 40) || 'tiktok';
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function shorten(str, len) {
  return !str ? '' : str.length > len ? str.slice(0, len) + '…' : str;
}

function pasteFromClipboard() {
  navigator.clipboard.readText()
    .then(t => { document.getElementById('tiktokUrl').value = t; toast('Collé !'); })
    .catch(() => toast('Accès presse-papier refusé'));
}

function clearAll() {
  document.getElementById('tiktokUrl').value = '';
  document.getElementById('batchInput').value = '';
  document.getElementById('results').innerHTML = '';
  document.getElementById('rawCard').classList.add('hidden');
  allResults = [];
  updateStats();
  toast('Tout effacé');
}

function toggleBatch() {
  document.getElementById('batchArea').classList.toggle('hidden');
}

function exportJSON() {
  const data = allResults.filter(r => r.success).map(r => r.data);
  if (!data.length) return toast('Rien à exporter');
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tiktok-export-${Date.now()}.json`;
  a.click();
  toast('JSON exporté');
}

function copyAllImages() {
  const urls = allResults.filter(r => r.success && r.data.thumbnail_url).map(r => r.data.thumbnail_url);
  if (!urls.length) return toast('Aucune image');
  copyText(urls.join('\n'));
}

function copyMarkdown(idx) {
  const item = allResults[idx];
  if (!item?.success) return;
  const d = item.data;
  copyText(`![${d.title||''}](${d.thumbnail_url||''})\n\n**${d.title||''}**\nPar [${d.author_name||''}](${d.author_url||''})\n\n[Voir](${item.url})`);
}

function copyEmbed(idx) {
  const item = allResults[idx];
  if (!item?.success) return;
  copyText(item.data.html || generateEmbed(item.url, item.data));
}

function copyHtmlCard(idx) {
  const item = allResults[idx];
  if (!item?.success) return;
  copyText(generateHtmlCard(item));
}
</script>
